name: DotNet

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout rg-gui
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Checkout depends
      uses: actions/checkout@v4
      with:
        repository: kcowolf/rg-gui-depends
        path: depends

    - name: Setup DotNet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet packages
      run: dotnet restore

    - name: Build with dotnet
      run: dotnet build --configuration Release --no-restore

    - name: Publish
      run: dotnet publish rg-gui.sln --configuration Release --framework net8.0-windows --output ./publish --runtime win-x64  --no-self-contained -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false

    - name: Compress files
      run: |-
        $releaseTag = if ('${{ github.ref_name }}' -like 'v*') { '${{ github.ref_name }}' } else { 'v0.8.2' }
        powershell Compress-Archive ${{ github.workspace }}\README.md,${{ github.workspace }}\LICENSE,${{ github.workspace }}\publish\*.exe,${{ github.workspace }}\publish\*.config,${{ github.workspace }}\depends\ripgrep\rg.exe ${{ github.workspace }}\rg-gui-${releaseTag}.zip

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.8.2' }}
        files: rg-gui-*.zip
